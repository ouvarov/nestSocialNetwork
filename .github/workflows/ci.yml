name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type-check, lint and format
        run: npm run check
      - name: OpenAPI spec is up to date
        run: npm run openapi:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -- --ci

  docker:
    name: Docker image boots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Write secrets for compose
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start
        run: docker compose up --detach --build api
      - name: Wait until ready
        run: |
          for attempt in $(seq 30); do
            if curl --silent --fail http://localhost:5000/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
