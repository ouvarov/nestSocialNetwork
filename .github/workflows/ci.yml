name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type-check, lint and format
        run: npm run check
      - name: OpenAPI spec is up to date
        run: npm run openapi:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -- --ci

  e2e:
    name: E2E (Supertest, Socket.IO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000
      REFRESH_TOKEN_SECRET: ci-refresh-secret-that-is-long-enough-00
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:e2e -- --ci

  docker:
    name: Docker image boots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Write secrets for compose
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start
        run: docker compose up --detach --build api
      - name: Wait until ready
        run: |
          for attempt in $(seq 30); do
            if curl --silent --fail http://localhost:5000/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
