name: pulse-api

x-api-image: &api-image
  build: .
  image: pulse-api

x-local-database: &local-database
  DATABASE_URL: postgres://pulse:pulse@db:5432/pulse

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulse -d pulse']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api-image
    command: ['node', 'dist/database/migrate.js']
    environment:
      <<: *local-database
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *api-image
    profiles: [seed]
    command: ['node', 'dist/database/seed.js']
    environment:
      <<: *local-database
      NODE_ENV: development
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-image
    env_file: .env
    environment:
      <<: *local-database
      NODE_ENV: development
      PORT: 5000
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      PUBLIC_URL: http://localhost:5000
    volumes:
      - uploads:/app/uploads
    ports:
      - '5000:5000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data: {}
  redis_data: {}
  uploads: {}
